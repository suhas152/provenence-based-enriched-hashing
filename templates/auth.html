{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
  <h2>{{ 'Create account' if mode == 'register' else 'Login' }}</h2>
  <form method="post">
    <p><input name="username" placeholder="Username" required style="width:100%;box-sizing:border-box"></p>
    <p><input name="password" type="password" placeholder="Password" required style="width:100%;box-sizing:border-box"></p>
    <button class="btn">{{ 'Register' if mode == 'register' else 'Login' }}</button>
  </form>
  {% if mode == 'login' %}
  <p class="muted">No account? <a href="{{ url_for('register') }}">Register</a></p>
  {% endif %}
</div>
{% endblock %}
