{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ doc.name }}</h2>
  <form method="post" action="{{ url_for('edit_file', doc_id=doc.doc_id) }}">
    <textarea name="content" rows="10" style="width:100%;box-sizing:border-box">{{ doc.content }}</textarea>
    <p><button class="btn">Save (Edit File)</button></p>
  </form>
  <form method="post" action="{{ url_for('delete_file', doc_id=doc.doc_id) }}"
        onsubmit="return confirm('Delete {{ doc.name }}?')">
    <button class="btn danger">Delete file</button>
  </form>
  <p><a href="{{ url_for('workspace') }}">&larr; Back</a></p>
</div>
{% endblock %}
